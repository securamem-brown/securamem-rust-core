[package]
name = "securamem-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "smrust"
path = "src/main.rs"

[dependencies]
securamem-core = { path = "../securamem-core" }
securamem-crypto = { path = "../securamem-crypto" }
securamem-storage = { path = "../securamem-storage" }
securamem-l1 = { path = "../securamem-l1" }
securamem-l3 = { path = "../securamem-l3" }
securamem-firewall = { path = "../securamem-firewall" }
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
serde_json = { workspace = true }
